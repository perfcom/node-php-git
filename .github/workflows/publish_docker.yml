name: Build and Push PHP+Node Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner.os }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        runner:
          - { os: ubuntu-latest,    platform: linux/amd64, suffix: amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, suffix: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker buildx build \
            --platform "${{ matrix.runner.platform }}" \
            --tag "${IMAGE}:${{ matrix.php }}-${{ matrix.runner.suffix }}" \
            --push \
            "${{ matrix.php }}/"

  manifest:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker manifest create "${IMAGE}:${{ matrix.php }}" \
            "${IMAGE}:${{ matrix.php }}-amd64" \
            "${IMAGE}:${{ matrix.php }}-arm64"
          docker manifest push "${IMAGE}:${{ matrix.php }}"
